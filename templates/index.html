<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Video Repost</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tasks-list {
            margin-top: 30px;
            border-top: 2px solid #e0e0e0;
            padding-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .tasks-list h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .task-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }

        .task-item:hover {
            transform: translateX(-5px);
        }

        .task-item p {
            color: #666;
            font-size: 13px;
            margin: 5px 0;
            word-break: break-all;
        }

        .task-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .task-status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .task-status.processing {
            background: #cfe2ff;
            color: #084298;
        }

        .task-status.completed {
            background: #d4edda;
            color: #155724;
        }

        .task-status.failed {
            background: #f8d7da;
            color: #721c24;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #0c4a8f;
            line-height: 1.6;
        }

        .refresh-btn {
            background: #6c757d;
            font-size: 12px;
            padding: 8px 12px;
            margin-top: 10px;
        }

        .refresh-btn:hover:not(:disabled) {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Instagram Repost</h1>
            <p>حمّل الفيديوهات ونشرها تلقائياً</p>
        </div>

        <div class="info-box">
            ⚠️ تأكد من صحة بيانات الدخول ورابط الحساب المستهدف
        </div>

        <form id="repostForm">
            <div class="form-group">
                <label for="username">👤 اسم المستخدم (حسابك)</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="أدخل اسم حسابك"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">🔐 كلمة المرور</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="أدخل كلمة المرور"
                    required
                >
            </div>

            <div class="form-group">
                <label for="targetUrl">🎬 رابط الحساب المستهدف</label>
                <input 
                    type="text" 
                    id="targetUrl" 
                    name="targetUrl" 
                    placeholder="https://instagram.com/username"
                    required
                >
            </div>

            <button type="submit" class="btn">🚀 ابدأ إعادة النشر</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #667eea;">جاري المعالجة...</p>
        </div>

        <div class="message" id="message"></div>

        <div class="tasks-list" id="tasksList" style="display: none;">
            <h2>📋 المهام الأخيرة</h2>
            <button type="button" class="refresh-btn" onclick="loadTasks()">🔄 تحديث</button>
            <div id="tasksContainer"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('repostForm');
        const message = document.getElementById('message');
        const loading = document.getElementById('loading');
        const tasksList = document.getElementById('tasksList');
        const tasksContainer = document.getElementById('tasksContainer');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.style.display = 'none';
            loading.style.display = 'block';
            form.querySelector('button').disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const targetUrl = document.getElementById('targetUrl').value;

            try {
                const response = await fetch('/api/start-repost', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        instagram_username: username,
                        instagram_password: password,
                        target_url: targetUrl
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('✅ ' + data.message, 'success');
                    form.reset();
                    
                    // بدء التحديث المنتظم
                    const taskId = data.task_id;
                    let attempts = 0;
                    const maxAttempts = 60; // 5 دقائق بفحص كل 5 ثواني
                    
                    const checkStatus = async () => {
                        try {
                            const statusResponse = await fetch(`/api/task-status/${taskId}`);
                            const taskData = await statusResponse.json();
                            
                            loadTasks();
                            
                            if (taskData.status === 'completed' || taskData.status === 'failed' || attempts >= maxAttempts) {
                                loading.style.display = 'none';
                                form.querySelector('button').disabled = false;
                            } else {
                                attempts++;
                                setTimeout(checkStatus, 5000);
                            }
                        } catch (error) {
                            console.error('خطأ في التحقق من الحالة:', error);
                        }
                    };
                    
                    setTimeout(checkStatus, 2000);
                } else {
                    showMessage('❌ ' + data.error, 'error');
                    loading.style.display = 'none';
                    form.querySelector('button').disabled = false;
                }
            } catch (error) {
                showMessage('❌ خطأ: ' + error.message, 'error');
                loading.style.display = 'none';
                form.querySelector('button').disabled = false;
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
        }

        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks');
                const tasks = await response.json();

                if (tasks.length > 0) {
                    tasksList.style.display = 'block';
                    tasksContainer.innerHTML = tasks.slice(0, 10).map(task => `
                        <div class="task-item">
                            <p><strong>👤 المستخدم:</strong> ${task.instagram_username}</p>
                            <p><strong>🎬 الهدف:</strong> ${task.target_username}</p>
                            <p><strong>📅 التاريخ:</strong> ${task.created_at}</p>
                            <p><strong>📊 الفيديوهات:</strong> ${task.video_count}</p>
                            <p><strong>📝 الرسالة:</strong> ${task.message}</p>
                            <span class="task-status ${task.status}">${getStatusArabic(task.status)}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('خطأ في تحميل المهام:', error);
            }
        }

        function getStatusArabic(status) {
            const statusMap = {
                'pending': '⏳ قيد الانتظار',
                'processing': '⚙️ قيد المعالجة',
                'completed': '✅ مكتملة',
                'failed': '❌ فشلت'
            };
            return statusMap[status] || status;
        }

        // تحميل المهام عند فتح الصفحة
        loadTasks();
        
        // تحديث المهام كل 10 ثواني
        setInterval(loadTasks, 10000);
    </script>
</body>
</html>
